[package]
name = "fparma-bot"
version = "0.1.0"
edition = "2021"

[dependencies]
dotenv = "0.15.0"
envconfig = { version = "0.11.1"}
mongodb = "3.9.1"
poise = "0.7.1"
tokio = { version = "1.54.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
openssh-sftp-client = { version = "0.15.10", features = ["openssh"] }
anyhow = "1.0.104"
serde = "1.0.229"
chrono = "0.4.45"
openssh = { version = "0.11.6", features = ["native-mux"] }
reqwest = { version = "0.13.5", features = ["stream"] }
uuid = { version = "1.29.0" , features = ["v4"]}
thiserror = "2.0.21"
log = "0.4.34"
regex = "1.13.1"
gamedig = "0.9.0"
sled = "0.34.7"
bincode = { version = "2.0.1", features = ["serde"]}
this-error-from-box = "0.2.1"
